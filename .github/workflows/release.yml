name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: adgine-knowledge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION_VALUE" >&2
            exit 1
          fi
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          ADGINE_KNOWLEDGE_SKIP_VERSION_CHECK: "1"
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts setup.py tests

      - name: Build Skill packages
        run: python3 scripts/build_package.py --output dist

      - name: Verify package contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for package in sorted(Path("dist").glob("adgine-knowledge-v*")):
              with ZipFile(package) as archive:
                  names = set(archive.namelist())
              assert "SKILL.md" in names, f"{package} is missing SKILL.md"
              assert "VERSION" in names, f"{package} is missing VERSION"
              assert ".env" not in names, f"{package} contains .env"
              print(f"Verified {package}: {len(names)} files")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/adgine-knowledge-v${{ steps.version.outputs.version }}.skill
            dist/adgine-knowledge-v${{ steps.version.outputs.version }}.zip

